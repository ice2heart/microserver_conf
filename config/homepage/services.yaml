---
- Media:
    - Jellyfin:
        icon: jellyfin.svg
        href: https://media.microserver
        description: movies & tv
        server: local
        container: jellyfin
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: true

    - Kiwix:
        icon: kiwix.svg
        href: https://kiwix.microserver
        description: offline wikipedia
        server: local
        container: kiwix

    - Navidrome:
        icon: navidrome.svg
        href: https://navidrome.microserver
        description: music streaming
        server: local
        container: navidrome
        widget:
          type: navidrome
          url: http://navidrome:4533
          username: "{{HOMEPAGE_VAR_NAVIDROME_USERNAME}}"
          password: "{{HOMEPAGE_VAR_NAVIDROME_PASSWORD}}"

    - Beets:
        icon: mdi-music-note
        href: https://beets.microserver
        description: music tagger / importer
        server: local
        container: beets-flask

- Downloads:
    - qBittorrent:
        icon: qbittorrent.svg
        href: https://flood.microserver
        description: torrents (via VPN)
        server: local
        container: qbittorrent
        widget:
          type: qbittorrent
          url: http://gluetun:8080
          username: "{{HOMEPAGE_VAR_QBT_USERNAME}}"
          password: "{{HOMEPAGE_VAR_QBT_PASSWORD}}"
    - Paperless:
        icon: paperless-ngx.svg
        href: https://paperless.microserver
        description: document archive
        server: local
        container: paperless
        widget:
          type: paperlessngx
          url: http://paperless:8000
          username: "{{HOMEPAGE_VAR_PAPERLESS_USERNAME}}"
          password: "{{HOMEPAGE_VAR_PAPERLESS_PASSWORD}}"
    - Lidarr:
        icon: lidarr.svg
        href: https://lidarr.microserver
        description: music collection manager
        server: local
        container: lidarr
        widget:
          type: lidarr
          url: http://lidarr:8686
          key: "{{HOMEPAGE_VAR_LIDARR_KEY}}"
    - Prowlarr:
        icon: prowlarr.svg
        href: https://prowlarr.microserver
        description: indexer manager
        server: local
        container: prowlarr
        widget:
          type: prowlarr
          url: http://prowlarr:9696
          key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
    - FlareSolverr:
        icon: mdi-shield-lock-outline
        href: https://flaresolverr.microserver
        description: cloudflare solver proxy
        server: local
        container: flaresolverr

- Files:
    - Copyparty:
        icon: mdi-folder-network
        href: https://fs.microserver
        description: file browser
        server: local
        container: copyparty
    - SFTPGo:
        icon: mdi-nas
        href: https://minioadmin.microserver
        description: backup server (sftp/webdav)
        server: local
        container: sftpgo
    - Samba:
        icon: mdi-nas
        description: smb shares (Mount, Downloads)
        server: local
        container: samba

- Infrastructure:
    - Traefik:
        icon: traefik.svg
        href: https://traefik.microserver
        description: reverse proxy
        server: local
        container: traefik
        widget:
          type: traefik
          url: http://traefik:8080
    - step-ca:
        icon: mdi-certificate
        description: local certificate authority
        server: local
        container: step-ca
    - Twingate:
        icon: twingate.png
        description: remote access connector
        server: local
        container: twingate
    - Gluetun:
        icon: gluetun.svg
        description: vpn tunnel
        server: local
        container: gluetun
        widget:
          type: gluetun
          url: http://gluetun:8000
          key: "{{HOMEPAGE_VAR_GLUETUN_KEY}}"
          version: 2
