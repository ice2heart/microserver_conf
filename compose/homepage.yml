services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    volumes:
      - "./config/homepage:/app/config"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    # run directly as ice + host docker group so the app can read docker.sock
    # (PUID/PGID would drop the supplementary group during the entrypoint's su-exec)
    user: "1000:1000"
    group_add:
      - "989"
    environment:
      HOMEPAGE_ALLOWED_HOSTS: glance.microserver
      # widget credentials, substituted into config/homepage/services.yaml
      HOMEPAGE_VAR_QBT_USERNAME: ${HOMEPAGE_VAR_QBT_USERNAME:-}
      HOMEPAGE_VAR_QBT_PASSWORD: ${HOMEPAGE_VAR_QBT_PASSWORD:-}
      HOMEPAGE_VAR_JELLYFIN_KEY: ${HOMEPAGE_VAR_JELLYFIN_KEY:-}
      HOMEPAGE_VAR_GLUETUN_KEY: ${HOMEPAGE_VAR_GLUETUN_KEY:-}
      HOMEPAGE_VAR_PAPERLESS_USERNAME: ${PAPERLESS_ADMIN_USER:-}
      HOMEPAGE_VAR_PAPERLESS_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:-}
      HOMEPAGE_VAR_LIDARR_KEY: ${HOMEPAGE_VAR_LIDARR_KEY:-}
      HOMEPAGE_VAR_SONARR_KEY: ${HOMEPAGE_VAR_SONARR_KEY:-}
      HOMEPAGE_VAR_RADARR_KEY: ${HOMEPAGE_VAR_RADARR_KEY:-}
      HOMEPAGE_VAR_PROWLARR_KEY: ${HOMEPAGE_VAR_PROWLARR_KEY:-}
      HOMEPAGE_VAR_NAVIDROME_USERNAME: ${HOMEPAGE_VAR_NAVIDROME_USERNAME:-}
      HOMEPAGE_VAR_NAVIDROME_TOKEN: ${HOMEPAGE_VAR_NAVIDROME_TOKEN:-}
      HOMEPAGE_VAR_NAVIDROME_SALT: ${HOMEPAGE_VAR_NAVIDROME_SALT:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`glance.microserver`)"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
    networks:
      - proxy

networks:
  proxy:
    name: torrentbox_proxy
