services:
  copyparty:
    image: copyparty/ac:latest
    container_name: copyparty
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      # config (committed as .example; real file is gitignored — contains the account password)
      - "./config/copyparty:/cfg:z"
      # state (session db, salts, thumbs) — nested mount inside /cfg
      - "./data/copyparty:/cfg/copyparty:z"
      - "./downloads:/w:z"
    environment:
      LD_PRELOAD: /usr/lib/libmimalloc-secure.so.NOPE
      # enable mimalloc by replacing "NOPE" with "2" for a nice speed-boost (will use twice as much ram)
      PYTHONUNBUFFERED: 1
      # ensures log-messages are not delayed (but can reduce speed a tiny bit)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fs.rule=Host(`fs.microserver`)"
      - "traefik.http.routers.fs.entrypoints=websecure"
      - "traefik.http.services.fs.loadbalancer.server.port=3923"
    stop_grace_period: 15s  # thumbnailer is allowed to continue finishing up for 10s after the shutdown signal
    healthcheck:
      # hide it from logs with "/._" so it matches the default --lf-url filter
      test: ["CMD-SHELL", "wget --spider -q 127.0.0.1:3923/?reset=/._"]
      interval: 1m
      timeout: 2s
      retries: 5
      start_period: 15s
    networks:
      - proxy

networks:
  proxy:
    name: torrentbox_proxy
