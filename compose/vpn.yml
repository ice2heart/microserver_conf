services:
  # https://github.com/qdm12/gluetun-wiki -- VPN client with built-in kill switch.
  # ProtonVPN port forwarding is negotiated via NAT-PMP and pushed into
  # qBittorrent's listen port automatically (VPN_PORT_FORWARDING_UP_COMMAND).
  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: openvpn
      OPENVPN_USER: ${VPN_USER}
      OPENVPN_PASSWORD: ${VPN_PASSWORD}
      SERVER_COUNTRIES: ${VPN_SERVER_COUNTRIES:-Romania}
      VPN_PORT_FORWARDING: "on"
      PORT_FORWARD_ONLY: "on"
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'wget -O- --retry-connrefused --post-data
        "json={\"listen_port\":{{PORTS}}}"
        http://127.0.0.1:8080/api/v2/app/setPreferences 2>&1'
      # allow traefik (proxy network) to reach the qbittorrent webui
      FIREWALL_INPUT_PORTS: "8080"
      TZ: ${TZ:-UTC}
    volumes:
      - "./data/gluetun:/gluetun"
    labels:
      # routers live on gluetun because qbittorrent shares its network namespace
      - "traefik.enable=true"
      - "traefik.http.routers.flood.rule=Host(`flood.microserver`)"
      - "traefik.http.routers.flood.entrypoints=websecure"
      - "traefik.http.services.flood.loadbalancer.server.port=8080"
    networks:
      - proxy

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=8080
    volumes:
      - "./data/qbittorrent:/config"
      - "./data/qbittorrent/ui:/ui:ro"
      - "./downloads:/downloads"

networks:
  proxy:
    name: torrentbox_proxy
