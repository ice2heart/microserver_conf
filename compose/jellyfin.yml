services:
  jellyfin:
    image: jellyfin/jellyfin:10
    container_name: jellyfin
    restart: unless-stopped
    user: 1000:1000
    volumes:
      - "./data/jellyfin/config:/config"
      - "./data/jellyfin/cache:/cache"
      - type: bind
        source: ./downloads/
        target: /media
        read_only: true
    # alternative address used for client autodiscovery
    environment:
      - JELLYFIN_PublishedServerUrl=https://media.microserver
    ports:
      - "7359:7359/udp"
      - "1900:1900/udp"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`media.microserver`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
    networks:
      - proxy

networks:
  proxy:
    name: torrentbox_proxy
